<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHANTAS MAGORIAS">
<title>PHANTAS MAGORIAS</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    overflow-x: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  #list {
    padding: calc(14vh + env(safe-area-inset-top)) 0 45vh calc(4vw + env(safe-area-inset-left));
    min-height: 100vh; box-sizing: border-box;
  }
  .t {
    font-size: clamp(10px, 1.75vw, 24px);
    line-height: 1.5;
    white-space: nowrap;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: opacity .15s;
  }
  .t:active { opacity: .3; }
  .t .txt { transition: color .2s; }
  .t.active .txt { color: #ff6fb5; }
  .t .ln {
    display: inline-block; vertical-align: middle;
    width: 0; height: 1px; background: #fff;
    transition: width .2s ease;
  }
  .t.collapsed .ln { width: 1.6em; }

  .win {
    position: fixed;
    background: #000;
    touch-action: none;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.35);
  }
  .win.anim { transition: left .28s ease, top .28s ease, width .28s ease, height .28s ease; }
  .win.flash { box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); }
  .win video {
    width: 100%; height: 100%; display: block;
    object-fit: contain; background: #000;
    pointer-events: none;
  }
  .x, .rs { position: absolute; width: 40px; height: 40px; touch-action: none; }
  .x { top: 0; left: 0; }
  .x::before, .x::after {
    content: ""; position: absolute; left: 13px; top: 19.5px;
    width: 14px; height: 1px; background: rgba(255,255,255,.8);
  }
  .x::before { transform: rotate(45deg); }
  .x::after  { transform: rotate(-45deg); }
  .rs { right: 0; bottom: 0; }
  .rs::after {
    content: ""; position: absolute; right: 7px; bottom: 7px;
    width: 12px; height: 12px;
    border-right: 1px solid rgba(255,255,255,.8);
    border-bottom: 1px solid rgba(255,255,255,.8);
  }
  #pick { display: none; }
</style>
</head>
<body>
<div id="list"></div>
<input id="pick" type="file" accept="video/*" multiple>

<script>
/* Videos sitting next to this file (used when opened from the folder on a Mac). */
const MANIFEST = [
  "00125.mov",
  "00132.mov",
  "RPReplay_Final1698920393.mp4",
  "Screen Recording 2024-10-24 at 11.44.12 PM.mov",
  "v12044gd0000clmh43fog65tcoasrtfg.mov",
  "v14044g50000ck4d5erc77ubgiflmbcg.mov",
  "v15044gf0000d3vqcm7og65kbiqd0stg.MP4"
];

/* iOS / iPadOS only lets one video play with sound at a time.
   There, every window keeps playing muted and the sound follows the window you tap. */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const list = document.getElementById('list');
const picker = document.getElementById('pick');
let items = [];          // { title, src, size, mod }
const wins = [];         // open windows
let z = 10;
const PAD = 14;

/* ================= list ================= */
function render() {
  list.innerHTML = '';
  if (!items.length) {
    const d = document.createElement('div');
    d.className = 't';
    d.textContent = 'tap to load videos';
    d.onclick = () => picker.click();
    list.append(d);
    return;
  }
  for (const it of items) {
    const d = document.createElement('div');
    d.className = 't';
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = it.title;
    const ln = document.createElement('span'); ln.className = 'ln';
    d.append(txt, ln);
    d.onclick = e => openWin(it, e.clientX, e.clientY);
    it.row = d; it.txt = txt;
    list.append(d);
  }
}

/* Long-press on empty space = add more videos */
let lp = null, lpX = 0, lpY = 0;
list.addEventListener('pointerdown', e => {
  if (e.target.closest('.t')) return;
  lpX = e.clientX; lpY = e.clientY;
  lp = setTimeout(() => { lp = null; picker.click(); }, 650);
});
const cancelLp = e => {
  if (!lp) return;
  if (e.type === 'pointermove' && Math.hypot(e.clientX - lpX, e.clientY - lpY) < 10) return;
  clearTimeout(lp); lp = null;
};
['pointerup', 'pointercancel', 'pointermove'].forEach(t => list.addEventListener(t, cancelLp));

/* ================= duplicates ================= */
function isDuplicate(name, size, mod) {
  return items.some(i =>
    i.title === name ||
    (size && i.size === size && mod && i.mod === mod));
}

/* ================= storage (keeps picked videos between visits) ================= */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('phantas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('videos', { keyPath: 'name' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (err) { rej(err); }
  });
}
async function saveFiles(files) {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction('videos', 'readwrite');
      for (const f of files) tx.objectStore('videos').put({ name: f.name, blob: f, size: f.size, mod: f.lastModified, added: Date.now() });
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (err) { console.warn('could not store videos', err); }
}
async function loadStored() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('videos').objectStore('videos').getAll();
      r.onsuccess = () => res(r.result.sort((a, b) => a.added - b.added));
      r.onerror = () => rej(r.error);
    });
  } catch (err) { return []; }
}

picker.addEventListener('change', async () => {
  const files = [...picker.files];
  picker.value = '';
  const fresh = [];
  for (const f of files) {
    if (isDuplicate(f.name, f.size, f.lastModified)) continue;
    items.push({ title: f.name, src: URL.createObjectURL(f), size: f.size, mod: f.lastModified });
    fresh.push(f);
  }
  if (!fresh.length) return;
  render();
  saveFiles(fresh);
});

/* Check whether a video next to this page is reachable */
function probe(src) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    const done = ok => { clearTimeout(t); v.removeAttribute('src'); v.load(); res(ok); };
    const t = setTimeout(() => done(false), 4000);
    v.onloadedmetadata = () => done(true);
    v.onerror = () => done(false);
    v.src = src;
  });
}

/* ================= layout ================= */
const view = () => ({ W: innerWidth, H: innerHeight });
/* Largest a window opens at: about 1/5 of the screen's area. */
const capWidth = aspect => {
  const { W, H } = view();
  let w = Math.sqrt(W * H * 0.2 * aspect);
  return Math.min(w, W - 2 * PAD, (H - 2 * PAD) * aspect);
};

function apply(o, animate) {
  o.el.classList.toggle('anim', !!animate);
  o.el.style.width = o.w + 'px';
  o.el.style.height = o.h + 'px';
  o.el.style.left = o.left + 'px';
  o.el.style.top = o.top + 'px';
}

const anyAdjusted = () => wins.some(o => o.adjusted);

/* Nobody has moved/resized anything yet: tile every window into a tidy grid. */
function tile() {
  const n = wins.length;
  if (!n) return;
  const { W, H } = view();
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = (W - PAD * (c + 1)) / c;
    const ch = (H - PAD * (r + 1)) / r;
    if (cw < 80 || ch < 60) continue;
    let area = 0;
    const cells = wins.map((o, i) => {
      const col = i % c, row = Math.floor(i / c);
      const inRow = Math.min(c, n - row * c);                 // center a short last row
      const rowOffset = (c - inRow) * (cw + PAD) / 2;
      const w = Math.min(cw, ch * o.aspect, capWidth(o.aspect));
      const h = w / o.aspect;
      area += w * h;
      return {
        w, h,
        left: rowOffset + PAD + col * (cw + PAD) + (cw - w) / 2,
        top: PAD + row * (ch + PAD) + (ch - h) / 2
      };
    });
    if (!best || area > best.area * 1.02) best = { area, cells };
  }
  if (!best) return;
  wins.forEach((o, i) => { Object.assign(o, best.cells[i]); apply(o, true); });
}

/* Someone has arranged things: leave every other window alone and
   drop this one into the emptiest spot, shrinking it if needed. */
function placeFree(o, ax, ay, animate) {
  const { W, H } = view();
  const others = wins.filter(p => p !== o);
  const overlap = (l, t, w, h) => others.reduce((s, p) => {
    const ox = Math.max(0, Math.min(l + w, p.left + p.w) - Math.max(l, p.left));
    const oy = Math.max(0, Math.min(t + h, p.top + p.h) - Math.max(t, p.top));
    return s + ox * oy;
  }, 0);

  let fallback = null;
  for (const s of [1, 0.8, 0.64, 0.5, 0.38]) {
    const w = Math.max(120, capWidth(o.aspect) * s), h = w / o.aspect;
    if (w > W - 2 * PAD || h > H - 2 * PAD) continue;
    let bestHere = null;
    const step = 20;
    for (let t = PAD; t <= H - h - PAD; t += step) {
      for (let l = PAD; l <= W - w - PAD; l += step) {
        const ov = overlap(l, t, w, h);
        const dist = Math.hypot(l + w / 2 - ax, t + h / 2 - ay);
        if (ov === 0 && (!bestHere || dist < bestHere.dist)) bestHere = { l, t, w, h, dist };
        const score = ov / (w * h) * 1e6 + dist;
        if (!fallback || score < fallback.score) fallback = { l, t, w, h, score };
      }
    }
    if (bestHere) { Object.assign(o, { left: bestHere.l, top: bestHere.t, w: bestHere.w, h: bestHere.h }); apply(o, animate); return; }
  }
  if (fallback) Object.assign(o, { left: fallback.l, top: fallback.t, w: fallback.w, h: fallback.h });
  apply(o, animate);
}

function relayout(o) {
  if (!anyAdjusted()) tile();
  else if (o && !o.adjusted) placeFree(o, o.left + o.w / 2, o.top + o.h / 2, true);
}

addEventListener('resize', () => { if (!anyAdjusted()) tile(); });

/* ================= audio focus (iOS) ================= */
let audible = null;
function giveSound(o) {
  audible = o;
  if (!IOS) { o.v.muted = false; return; }
  for (const p of wins) if (p !== o) p.v.muted = true;
  o.v.muted = false;
}

/* ================= title animation ================= */
// Reverse-types a title down into a short line, or types it back out.
function typeTo(it, full) {
  if (!it.txt) return;
  const target = full ? it.title : '';
  const token = (it.anim = (it.anim || 0) + 1);
  if (full) it.row.classList.remove('collapsed');
  const total = it.title.length || 1;
  const stepMs = Math.max(6, Math.min(28, 380 / total));
  const tick = () => {
    if (it.anim !== token) return;
    const cur = it.txt.textContent;
    if (cur === target) {
      if (!full) it.row.classList.add('collapsed');
      return;
    }
    it.txt.textContent = full ? it.title.slice(0, cur.length + 1) : cur.slice(0, -1);
    setTimeout(tick, stepMs);
  };
  tick();
}
function setRow(it, state) {          // 'idle' | 'active' | 'collapsed'
  if (!it.row) return;
  it.row.classList.toggle('active', state === 'active');
  typeTo(it, state !== 'collapsed');
}

let activeWin = null;
function setActive(o) {
  if (activeWin === o) return;
  if (activeWin && !activeWin.closed) setRow(activeWin.it, 'collapsed');
  activeWin = o;
  if (o) setRow(o.it, 'active');
}

/* ================= windows ================= */
function front(o) { o.el.style.zIndex = ++z; o.z = z; setActive(o); }

function closeWin(o) {
  o.closed = true;
  o.v.pause(); o.v.removeAttribute('src'); o.v.load();
  o.el.remove();
  wins.splice(wins.indexOf(o), 1);
  setRow(o.it, 'idle');
  const top = wins.reduce((a, b) => (!a || b.z > a.z ? b : a), null);
  if (activeWin === o) { activeWin = null; if (top) setActive(top); }
  if (audible === o) {
    audible = null;
    if (top && IOS) giveSound(top);
  }
  if (!anyAdjusted()) tile();
}

function openWin(it, x, y) {
  // Already open? Bring it forward instead of opening a duplicate.
  const existing = wins.find(o => o.it === it);
  if (existing) {
    front(existing);
    existing.el.classList.add('flash');
    setTimeout(() => existing.el.classList.remove('flash'), 350);
    if (IOS) giveSound(existing);
    if (existing.v.paused) existing.v.play().catch(() => {});
    return;
  }

  const el = document.createElement('div');
  el.className = 'win';
  const v = document.createElement('video');
  v.src = it.src;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.loop = true;
  v.preload = 'auto';
  const xb = document.createElement('div'); xb.className = 'x';
  const rs = document.createElement('div'); rs.className = 'rs';
  el.append(v, xb, rs);
  document.body.append(el);

  const w0 = capWidth(16 / 9);
  const o = { it, el, v, aspect: 16 / 9, w: w0, h: w0 * 9 / 16,
              left: x, top: y, adjusted: false, closed: false };
  o.left = x - o.w / 2; o.top = y - o.h / 2;
  wins.push(o);
  front(o);

  if (anyAdjusted()) placeFree(o, x, y, false);
  else tile();

  v.addEventListener('loadedmetadata', () => {
    if (!v.videoWidth) return;
    o.aspect = v.videoWidth / v.videoHeight;
    if (o.adjusted) { o.h = o.w / o.aspect; apply(o, false); }
    else relayout(o);
  });

  // Nothing ever stays paused: if the system pauses a window (iOS audio rule), restart it muted.
  v.addEventListener('pause', () => {
    if (o.closed) return;
    setTimeout(() => {
      if (o.closed || !v.paused) return;
      if (audible !== o) v.muted = true;
      v.play().catch(() => {});
    }, 60);
  });

  // Play immediately with sound (the tap counts as permission).
  giveSound(o);
  v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });

  /* close */
  xb.addEventListener('pointerdown', e => e.stopPropagation());
  xb.addEventListener('click', e => { e.stopPropagation(); closeWin(o); });

  /* corner resize */
  rs.addEventListener('pointerdown', e => {
    e.stopPropagation(); front(o);
    el.classList.remove('anim');
    rs.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, sw = o.w;
    const move = ev => {
      const dx = ev.clientX - sx, dy = (ev.clientY - sy) * o.aspect;
      o.w = Math.max(140, sw + Math.max(dx, dy));
      o.h = o.w / o.aspect; o.adjusted = true; apply(o, false);
    };
    const up = () => { rs.removeEventListener('pointermove', move); rs.removeEventListener('pointerup', up); rs.removeEventListener('pointercancel', up); };
    rs.addEventListener('pointermove', move);
    rs.addEventListener('pointerup', up);
    rs.addEventListener('pointercancel', up);
  });

  /* drag (1 finger), pinch-resize (2 fingers), tap */
  const pts = new Map();
  let start = null;
  const snapshot = () => {
    const p = [...pts.values()];
    start = {
      left: o.left, top: o.top, w: o.w,
      t: performance.now(), moved: false,
      p0: { ...p[0] },
      dist: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0,
      mid: p.length > 1 ? { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 } : null,
      n: p.length
    };
  };
  const clampPos = () => {
    o.left = Math.min(Math.max(o.left, -o.w + 60), innerWidth - 60);
    o.top = Math.min(Math.max(o.top, 0), innerHeight - 60);
  };
  el.addEventListener('pointerdown', e => {
    front(o);
    el.classList.remove('anim');
    el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const wasMoved = start && start.moved;
    snapshot();
    if (wasMoved || pts.size > 1) start.moved = true;
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...pts.values()];
    if (start.n >= 2 && p.length >= 2) {
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const nw = Math.min(Math.max(start.w * d / start.dist, 140), innerWidth * 1.6);
      const cx = start.left + start.w / 2 + (mid.x - start.mid.x);
      const cy = start.top + start.w / o.aspect / 2 + (mid.y - start.mid.y);
      o.w = nw; o.h = o.w / o.aspect; o.left = cx - o.w / 2; o.top = cy - o.h / 2;
      start.moved = true; o.adjusted = true; apply(o, false);
    } else if (p.length === 1) {
      const dx = p[0].x - start.p0.x, dy = p[0].y - start.p0.y;
      if (!start.moved && Math.hypot(dx, dy) < 8) return;
      start.moved = true; o.adjusted = true;
      o.left = start.left + dx; o.top = start.top + dy; clampPos(); apply(o, false);
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 0) {
      if (!start.moved && performance.now() - start.t < 350 && e.type === 'pointerup') onTap();
      start = null;
    } else {
      snapshot(); start.moved = true;
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  function onTap() {
    // No pausing. On iPad a tap moves the sound to this window.
    if (IOS) giveSound(o);
    else if (v.muted) v.muted = false;
    if (v.paused) v.play().catch(() => {});
  }
}

/* ================= fullscreen: two-finger tap on empty space, or the F key ================= */
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (isFs) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (err) { console.warn('fullscreen not available', err); }
}
let twoTap = null;
list.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && ![...e.touches].some(t => t.target.closest && t.target.closest('.t'))) {
    twoTap = { t: performance.now(), x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (lp) { clearTimeout(lp); lp = null; }
  } else if (e.touches.length > 2) twoTap = null;
}, { passive: true });
list.addEventListener('touchmove', e => {
  if (twoTap && Math.hypot(e.touches[0].clientX - twoTap.x, e.touches[0].clientY - twoTap.y) > 12) twoTap = null;
}, { passive: true });
list.addEventListener('touchend', e => {
  if (twoTap && e.touches.length === 0) {
    if (performance.now() - twoTap.t < 400) toggleFullscreen();
    twoTap = null;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) toggleFullscreen();
});

/* ================= spacebar = reset everything ================= */
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  e.preventDefault();
  [...wins].forEach(o => { o.closed = true; o.v.pause(); o.v.removeAttribute('src'); o.v.load(); o.el.remove(); });
  wins.length = 0;
  audible = null;
  activeWin = null;
  for (const it of items) if (it.row) { it.anim = (it.anim || 0) + 1; it.row.classList.remove('active', 'collapsed'); it.txt.textContent = it.title; }
  z = 10;
  window.scrollTo(0, 0);
});

/* ================= boot ================= */
(async () => {
  const stored = await loadStored();
  if (stored.length) {
    for (const s of stored) {
      if (isDuplicate(s.name, s.size, s.mod)) continue;
      items.push({ title: s.name, src: URL.createObjectURL(s.blob), size: s.size, mod: s.mod });
    }
  } else {
    const found = await Promise.all(MANIFEST.map(async n => {
      const src = encodeURI(n);
      return (await probe(src)) ? { title: n, src } : null;
    }));
    items = found.filter(Boolean);
  }
  render();
})();
render();
</script>
</body>
</html>
