<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="PHANTAS MAGORIAS">
<title>PHANTAS MAGORIAS</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    overflow-x: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  #list {
    padding: calc(14vh + env(safe-area-inset-top)) 0 45vh calc(4vw + env(safe-area-inset-left));
    min-height: 100vh; box-sizing: border-box;
  }
  .t {
    font-size: clamp(10px, 1.75vw, 24px);
    line-height: 1.5;
    white-space: nowrap;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: opacity .15s;
  }
  .t:active { opacity: .3; }
  .t .txt { transition: color .2s; }
  .t.active .txt { color: #ff6fb5; }
  .t .ln {
    display: inline-block; vertical-align: middle;
    width: 0; height: 1.5px; border-radius: 1px;
    background: var(--c, #fff);
    box-shadow: 0 0 6px var(--c, transparent);
    transition: width .2s ease, background .3s ease;
  }
  .t.collapsed .ln { width: 1.6em; }

  .win {
    position: fixed;
    background: #000;
    touch-action: none;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.35);
  }
  .win.locked {
    box-shadow: 0 0 0 1px rgba(255,150,205,.8), 0 0 0 3.5px rgba(255,111,181,.14),
                0 0 22px rgba(255,111,181,.32), inset 0 0 0 .5px rgba(255,255,255,.35);
  }
  .win.lockpulse { animation: lockpulse .5s ease; }
  @keyframes lockpulse { 40% { box-shadow: 0 0 0 1.5px rgba(255,170,215,.95), 0 0 0 5px rgba(255,111,181,.22), 0 0 40px rgba(255,111,181,.55); } }
  #list { position: relative; z-index: 1; }
  .aud { position: absolute; cursor: pointer; animation: audin .32s cubic-bezier(.2,.9,.3,1.3) backwards; }
  .aud canvas { width: 100%; height: 100%; display: block; }
  .aud.out { opacity: 0; transform: scale(.5); transition: opacity .18s, transform .18s; }
  @keyframes audin { from { opacity: 0; transform: scale(.3); } }
  .win { left: 0; top: 0; will-change: transform; }
  .win.anim { transition: transform .28s ease, width .28s ease, height .28s ease; }
  .win.flash { box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); }
  .win video {
    width: 100%; height: 100%; display: block;
    object-fit: contain; background: #000;
    pointer-events: none;
  }
  .x, .rs { position: absolute; width: 40px; height: 40px; touch-action: none; transition: opacity .2s ease; }
  /* close + resize only on the active (top) window */
  .win:not(.top) .x, .win:not(.top) .rs { opacity: 0; pointer-events: none; }
  .x { top: 0; left: 0; }
  .x::before, .x::after {
    content: ""; position: absolute; left: 13px; top: 19.5px;
    width: 14px; height: 1px; background: rgba(255,255,255,.8);
  }
  .x::before { transform: rotate(45deg); }
  .x::after  { transform: rotate(-45deg); }
  .rs { right: 0; bottom: 0; }
  .rs::after {
    content: ""; position: absolute; right: 7px; bottom: 7px;
    width: 12px; height: 12px;
    border-right: 1px solid rgba(255,255,255,.8);
    border-bottom: 1px solid rgba(255,255,255,.8);
  }
  #pick { display: none; }

  /* ---- rename mode ---- */
  .t.editing .etxt { color: #ff6fb5; }
  .t .eext { color: rgba(255,111,181,.45); }
  .caret {
    display: inline-block; width: 1px; height: 1.05em;
    vertical-align: -0.18em; margin: 0 1px; background: #ff6fb5;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .t.saved .txt { color: #2ee6d2; }
  .t.canceled .txt { color: #ff3b4a; }

  /* ---- keyboard: a chunked rotary wheel, bottom-right ---- */
  #kb {
    position: fixed; z-index: 100000;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(26px + env(safe-area-inset-bottom));
    width: clamp(290px, 34vw, 380px); aspect-ratio: 1 / 1;
    touch-action: none; pointer-events: none; opacity: 0;
    transform: scale(.9) rotate(-10deg); transform-origin: 50% 50%;
    transition: transform .5s cubic-bezier(.2,.9,.25,1.08), opacity .25s ease;
  }
  #kb.open { opacity: 1; transform: none; pointer-events: auto; }
  .dial { position: absolute; inset: 0; border-radius: 50%; cursor: grab; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wedge { fill: rgba(0,0,0,.88); stroke: rgba(255,255,255,.24); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .2s, stroke .2s; }
  .wedge.sel { fill: rgba(255,111,181,.09); stroke: #ff6fb5; }
  .wedge.num { fill: rgba(255,255,255,.075); stroke: rgba(255,255,255,.16); }
  .wedge.num.sel { fill: rgba(255,111,181,.14); stroke: #ff6fb5; }
  .chunk {
    position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
    font-weight: 200; font-size: clamp(15px, 1.65vw, 19px); letter-spacing: .06em; color: rgba(255,255,255,.72);
    transition: color .2s;
    will-change: transform;
  }
  .chunk.sel { color: #ff6fb5; }
  .chunk.num { font-size: clamp(11px, 1.15vw, 14px); letter-spacing: .04em; color: rgba(255,255,255,.6); }
  .chunk.num.sel { color: #ff6fb5; }
  #kb.open .chunk { animation: rin .45s ease backwards; animation-delay: calc(var(--i) * 25ms + 100ms); }
  @keyframes rin { from { opacity: 0; } }
  .hub {
    position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%;
    background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .trio { display: flex; gap: 0; align-items: center; }
  .trio .L {
    min-width: .72em; padding: 4px 1px; text-align: center; cursor: pointer;
    font-weight: 100; font-size: clamp(32px, 3.7vw, 44px); line-height: 1; color: #fff;
    transition: color .1s, transform .1s;
  }
  .trio .L.down { color: #ff6fb5; transform: scale(.92); }
  .trio .L.in { animation: flipin .34s cubic-bezier(.2,.9,.3,1.25) backwards; animation-delay: calc(var(--k) * 45ms); }
  @keyframes flipin { from { opacity: 0; transform: perspective(220px) rotateX(-85deg) translateY(-8px); } }
  .trio.emo { flex-direction: column; gap: 0; }
  .trio.emo .L { min-width: 0; padding: 3px 6px; font-size: clamp(10px, 1.05vw, 13px); font-weight: 300; }
  .hub-mode { margin-top: 0; padding: 5px 8px; font-size: 12px; font-weight: 300; letter-spacing: .06em; color: rgba(255,255,255,.55); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .hub-mode::before { content: ""; width: 5px; height: 5px; border-right: 1px solid #ff6fb5; border-bottom: 1px solid #ff6fb5; transform: translateY(-2px) rotate(45deg); }
  .hub-mode.down { color: #ff6fb5; }
  /* controls live to the left of the wheel, away from the spinning hand */
  /* cancel / + videos / OK: centred along the bottom of the screen while renaming */
  .bar {
    position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom)); z-index: 100000;
    display: flex; align-items: center; gap: 34px; white-space: nowrap;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    transition: transform .4s cubic-bezier(.2,.9,.25,1.08), opacity .25s ease;
  }
  .bar.open { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .ctl { font-size: 15px; font-weight: 200; letter-spacing: .04em; color: rgba(255,255,255,.75); cursor: pointer; padding: 8px 0; transition: opacity .1s, transform .1s; }
  .ctl.down { opacity: .45; transform: scale(.96); }
  .ctl.cancel { color: #ff3b4a; }
  .ctl.add { color: rgba(255,255,255,.45); }
  .ctl.enter { color: #2ee6d2; text-shadow: 0 0 12px rgba(46,230,210,.55); }
  /* corner pieces: the leftover space between the wheel and its square, outlined like the segments */
  .kbtn { position: absolute; width: 32%; height: 32%; pointer-events: none; color: rgba(255,255,255,.85); }
  .kbtn.k-del { top: 0; right: 0; }
  .kbtn.heart { bottom: 0; left: 0; }
  .kbtn.caps { bottom: 0; right: 0; }
  .kbtn .shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .kbtn .shape path {
    fill: rgba(0,0,0,.88); stroke: rgba(255,255,255,.24); stroke-width: 1; vector-effect: non-scaling-stroke;
    stroke-linejoin: round; pointer-events: all; cursor: pointer; transition: fill .15s, stroke .15s;
  }
  .kbtn.down .shape path { fill: rgba(255,255,255,.07); }
  .kbtn.on .shape path { stroke: #ff6fb5; fill: rgba(255,111,181,.09); }
  .kbtn .ico {
    position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); pointer-events: none;
    fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .1s, color .15s;
  }
  .kbtn.down .ico { transform: translate(-50%, -50%) scale(.88); }
  .kbtn.on { color: #ff6fb5; }
  .kbtn.heart.on .ico { fill: rgba(255,111,181,.4); }
  .kbtn.caps.lock .shape path { fill: rgba(255,111,181,.24); }
  .kbtn.ext { top: 0; left: 0; }
  .kbtn.ext .shape path { cursor: grab; }
  .kbtn.k-redo { top: 0; right: 0; }
  .kbtn.k-del .ico, .kbtn.k-redo .ico { width: 21px; height: 21px; }

  /* bottom-row keyboard icon (summons the iPad's own keyboard) */
  .ctl.kbd svg { width: 26px; height: 26px; display: block; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #native { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; pointer-events: none; }

  /* full keyboard: unfolds out of the wheel's top-left corner and takes over the bottom of the screen */
  .xkb {
    position: fixed; z-index: 100001;
    left: max(26px, calc((100vw - 1040px) / 2)); right: max(26px, calc((100vw - 1040px) / 2));
    bottom: calc(26px + env(safe-area-inset-bottom));
    padding: 16px; border-radius: 26px; box-sizing: border-box;
    background: rgba(0,0,0,.94); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 24px 70px rgba(0,0,0,.6);
    transform-origin: 100% 100%;
    transform: perspective(1400px) rotateX(30deg) rotateY(-30deg) scale(.15); opacity: 0; pointer-events: none;
    transition: transform .55s cubic-bezier(.2,.9,.25,1.04), opacity .3s ease;
    touch-action: none;
  }
  .xkb.dragging { transition: none; }
  .xkb.open { pointer-events: auto; }
  .emo-strip {
    position: relative; overflow: hidden; height: 100%; flex: 8 1 0; border-radius: 12px; margin-bottom: 4px;
    background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); cursor: grab;
    -webkit-mask: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
            mask: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  }
  .emo-track { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; gap: 26px; padding: 0 13px; white-space: nowrap; will-change: transform; }
  .emo { font-size: 15px; font-weight: 300; color: rgba(255,255,255,.82); transition: color .1s; }
  .emo.down { color: #ff6fb5; }
  /* every row is ten equal keys wide and runs edge to edge */
  .xrow { display: flex; gap: 8px; margin-top: 8px; }
  .xrow.top { margin-top: 0; padding-left: 46px; height: clamp(46px, 6.4vh, 60px); }
  .xk {
    flex: 1 1 0; min-width: 0;
    height: clamp(46px, 6.4vh, 60px); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 20px; font-weight: 200; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    transition: color .1s, box-shadow .1s, background .1s, transform .08s;
  }
  .xrow.nums .xk { font-size: 17px; background: rgba(255,255,255,.075); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .xk.icon { color: rgba(255,255,255,.85); }
  .xk.cancel { color: #ff3b4a; box-shadow: inset 0 0 0 1px rgba(255,59,74,.6); }
  .xk.ok { color: #2ee6d2; font-weight: 300; box-shadow: inset 0 0 0 1px rgba(46,230,210,.65); text-shadow: 0 0 12px rgba(46,230,210,.5); }
  .xk.add { color: rgba(255,255,255,.6); }
  .xk.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .xk.on { color: #ff6fb5; box-shadow: inset 0 0 0 1px #ff6fb5; }
  .xk.lock { background: rgba(255,111,181,.16); }
  /* fold-away handle in the keyboard's top-left corner */
  .xtab { position: absolute; left: 0; top: 0; width: 58px; height: 58px; cursor: grab; touch-action: none; }
  .xtab svg { width: 100%; height: 100%; fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2.4; stroke-linecap: round; }
  .xtab.down svg { stroke: #ff6fb5; }
  .xk.down { color: #ff6fb5; box-shadow: inset 0 0 0 1px #ff6fb5; background: rgba(255,111,181,.09); transform: scale(.95); }
  .xkb.open .xk { animation: kin .35s ease backwards; animation-delay: calc(var(--i) * 6ms + 120ms); }
  #kb.open .kbtn { animation: kin .4s ease backwards; animation-delay: .18s; }
  @keyframes kin { from { opacity: 0; } }
  .fly {
    position: fixed; z-index: 100001; pointer-events: none;
    transform: translate(-50%, -50%); color: #ff6fb5; font-weight: 100;
    font-size: clamp(36px, 4.3vw, 52px);
    transition: transform .42s cubic-bezier(.3,.7,.2,1), opacity .42s ease-in;
  }
</style>

<body>
<div id="list"></div>
<input id="pick" type="file" accept="video/*" multiple>
<div id="kb" aria-hidden="true"></div>

<script>
/* Videos sitting next to this file (used when opened from the folder on a Mac). */
const MANIFEST = [
  "00125.mov",
  "00132.mov",
  "RPReplay_Final1698920393.mp4",
  "Screen Recording 2024-10-24 at 11.44.12 PM.mov",
  "v12044gd0000clmh43fog65tcoasrtfg.mov",
  "v14044g50000ck4d5erc77ubgiflmbcg.mov",
  "v15044gf0000d3vqcm7og65kbiqd0stg.MP4"
];

/* iOS / iPadOS only lets one video play with sound at a time.
   There, every window keeps playing muted and the sound follows the window you tap. */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const list = document.getElementById('list');
const picker = document.getElementById('pick');
let items = [];          // { title, src, size, mod }
const wins = [];         // open windows
let z = 10;
const PAD = 14;

/* ================= list ================= */
function render() {
  list.innerHTML = '';
  if (!items.length) {
    const d = document.createElement('div');
    d.className = 't';
    d.textContent = 'tap to load videos';
    d.onclick = () => picker.click();
    list.append(d);
    return;
  }
  for (const it of items) {
    const d = document.createElement('div');
    d.className = 't';
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = it.title;
    const ln = document.createElement('span'); ln.className = 'ln';
    d.append(txt, ln);
    it.row = d; it.txt = txt;

    // tap = open, tap-and-hold = rename
    let hold = null, hx = 0, hy = 0;
    d.addEventListener('pointerdown', e => {
      it.skipClick = false;
      if (editing) return;
      hx = e.clientX; hy = e.clientY;
      hold = setTimeout(() => { hold = null; it.skipClick = true; startEdit(it); }, 480);
    });
    d.addEventListener('pointermove', e => {
      if (hold && Math.hypot(e.clientX - hx, e.clientY - hy) > 10) { clearTimeout(hold); hold = null; }
    });
    ['pointerup', 'pointercancel'].forEach(t => d.addEventListener(t, () => { if (hold) { clearTimeout(hold); hold = null; } }));
    d.addEventListener('contextmenu', e => e.preventDefault());
    d.onclick = e => {
      if (it.skipClick) { it.skipClick = false; return; }
      if (editing) return;
      openWin(it, e.clientX, e.clientY);
    };
    list.append(d);
  }
  syncRows();
  paintLines();
  // videos added from the keyboard mid-rename: keep the rename going on the rebuilt row
  if (editing && editing.it.row) {
    const it = editing.it;
    const txt = mk('etxt', editing.buf);
    it.row.className = 't editing';
    it.row.innerHTML = '';
    it.row.append(txt, mk('caret'), mk('eext', editing.ext));
    editing.txt = txt; editing.cutting = false;
  }
}

/* Long-press on empty space = add more videos */
let lp = null, lpX = 0, lpY = 0;
list.addEventListener('pointerdown', e => {
  if (e.target.closest('.t') || editing) return;
  lpX = e.clientX; lpY = e.clientY;
  lp = setTimeout(() => { lp = null; picker.click(); }, 650);
});
const cancelLp = e => {
  if (!lp) return;
  if (e.type === 'pointermove' && Math.hypot(e.clientX - lpX, e.clientY - lpY) < 10) return;
  clearTimeout(lp); lp = null;
};
['pointerup', 'pointercancel', 'pointermove'].forEach(t => list.addEventListener(t, cancelLp));

/* ================= duplicates ================= */
function isDuplicate(name, size, mod) {
  return items.some(i =>
    i.name === name ||
    (size && i.size === size && mod && i.mod === mod));
}

/* ================= storage (keeps picked videos between visits) ================= */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('phantas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('videos', { keyPath: 'name' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (err) { rej(err); }
  });
}
async function saveFiles(files) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) {}
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction('videos', 'readwrite');
      for (const f of files) tx.objectStore('videos').put({ name: f.name, blob: f, size: f.size, mod: f.lastModified, added: Date.now() });
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (err) { console.warn('could not store videos', err); }
}
async function loadStored() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('videos').objectStore('videos').getAll();
      r.onsuccess = () => res(r.result.sort((a, b) => a.added - b.added));
      r.onerror = () => rej(r.error);
    });
  } catch (err) { return []; }
}

picker.addEventListener('change', async () => {
  const files = [...picker.files];
  picker.value = '';
  const fresh = [];
  for (const f of files) {
    if (isDuplicate(f.name, f.size, f.lastModified)) continue;
    items.push({ name: f.name, title: titleFor(f.name), src: URL.createObjectURL(f), size: f.size, mod: f.lastModified });
    fresh.push(f);
  }
  if (!fresh.length) return;
  render();
  saveFiles(fresh);
});

/* Check whether a video next to this page is reachable */
function probe(src) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    const done = ok => { clearTimeout(t); v.removeAttribute('src'); v.load(); res(ok); };
    const t = setTimeout(() => done(false), 4000);
    v.onloadedmetadata = () => done(true);
    v.onerror = () => done(false);
    v.src = src;
  });
}

/* ================= layout ================= */
const view = () => ({ W: innerWidth, H: innerHeight });
/* Largest a window opens at: about 1/5 of the screen's area. */
const capWidth = aspect => {
  const { W, H } = view();
  let w = Math.sqrt(W * H * 0.2 * aspect);
  return Math.min(w, W - 2 * PAD, (H - 2 * PAD) * aspect);
};

function apply(o, animate) {
  o.el.classList.toggle('anim', !!animate);
  o.el.style.width = o.w + 'px';
  o.el.style.height = o.h + 'px';
  o.el.style.transform = `translate3d(${o.left}px, ${o.top}px, 0)`;
}

const anyAdjusted = () => wins.some(o => o.adjusted);

/* Where the visible title text sits on screen right now (windows try not to cover it). */
function textRects() {
  const out = [];
  for (const row of list.children) {
    const t = row.querySelector('.txt, .etxt');
    if (!t || !t.textContent) continue;
    const r = t.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || r.width === 0) continue;
    out.push({ left: r.left - 8, top: r.top - 4, w: r.width + 16, h: r.height + 8 });
  }
  return out;
}
function textRight() {
  return textRects().reduce((m, r) => Math.max(m, r.left + r.w), 0);
}

/* Untouched windows: keep the opening size, and pick the spot that overlaps other windows
   and the title text the least (leaning toward the top-right). A little stacking is fine
   once the screen fills up; new ones never move old ones. */
function placeSpread(o, animate) {
  const { W, H } = view();
  // a little variety: each window opens somewhere between ~70% and 100% of the size cap
  if (o.scale == null) o.scale = 0.7 + Math.random() * 0.3;
  const w = capWidth(o.aspect) * o.scale, h = w / o.aspect;
  const others = wins.filter(p => p !== o);
  const texts = textRects();
  const hit = (l, t, p) => {
    const ox = Math.max(0, Math.min(l + w, p.left + p.w) - Math.max(l, p.left));
    const oy = Math.max(0, Math.min(t + h, p.top + p.h) - Math.max(t, p.top));
    return ox * oy;

  const area = w * h, diag = Math.hypot(W, H);

  extBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    extBtn.setPointerCapture(e.pointerId);
    pull = { x: e.clientX, y: e.clientY, from: xProg, moved: 0 };
    extBtn.classList.add('down');
    beginPull();
  });
  extBtn.addEventListener('pointermove', e => {
    if (!pull) return;
    const dx = pull.x - e.clientX, dy = pull.y - e.clientY;
    pull.moved = Math.max(pull.moved, Math.hypot(dx, dy));
    if (pull.moved > 8) setXProg(Math.max(0, Math.min(1, pull.from + (dx + dy) / Math.SQRT2 / 320)));
  });
  const release = () => {
    if (!pull) return;
    extBtn.classList.remove('down');
    endPull();
    if (pull.moved <= 8) toggleXkb();
    else toggleXkb(xProg > (pull.from > .5 ? .65 : .3));
    pull = null;
  };
  extBtn.addEventListener('pointerup', release);
  extBtn.addEventListener('pointercancel', release);

  bar = document.createElement('div'); bar.className = 'bar';
  bar.addEventListener('pointerdown', e => e.stopPropagation());
  const enter = mk('ctl enter', 'OK');
  const cancel = mk('ctl cancel', 'cancel');
  const add = mk('ctl add', '+ videos');
  const kbd = document.createElement('div'); kbd.className = 'ctl kbd';
  kbd.innerHTML = '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.2"/><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M6.5 12.5h.01M9.5 12.5h.01M12.5 12.5h.01M15.5 12.5h.01M8 15.2h8"/></svg>';
  // focusing must happen inside the tap itself or iPadOS won't raise its keyboard
  kbd.addEventListener('pointerdown', e => { e.stopPropagation(); kbd.classList.add('down'); });
  kbd.addEventListener('pointerup', () => kbd.classList.remove('down'));
  kbd.addEventListener('click', e => {
    e.stopPropagation();
    if (!editing) return;
    if (document.activeElement === nativeIn) { nativeIn.blur(); return; }
    nativeIn.value = editing.buf;
    nativeIn.focus();
    try { nativeIn.setSelectionRange(nativeIn.value.length, nativeIn.value.length); } catch (err) {}
  });
  bar.append(cancel, add, kbd, enter);
  pressable(cancel, () => finishEdit(false));
  pressable(enter, () => finishEdit(true));
  // the file picker needs a real click to open on iPad
  add.addEventListener('pointerdown', e => { e.stopPropagation(); add.classList.add('down'); });
  add.addEventListener('pointerup', () => add.classList.remove('down'));
  add.addEventListener('click', e => { e.stopPropagation(); picker.click(); });
  kb.append(dial, del, redo, heartBtn, capsBtn, extBtn);
  document.body.append(bar);
  buildXkb();
  buildNative();
  buildRing('inner'); buildRing('outer');

  // one-finger spinning of whichever ring you touch; a still tap on a segment spins to it
  let key = 'outer', lastA = 0, lastT = 0, moved = 0, downA = 0;
  const polar = e => {
    const r = dial.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    return { a: Math.atan2(y, x), u: Math.hypot(x, y) / r.width * 200 };
  };
  dial.addEventListener('pointerdown', e => {
    if (e.target.closest('.hub')) return;
    e.preventDefault(); e.stopPropagation();
    const p = polar(e);
    key = p.u < (RINGS.inner.rOut + RINGS.outer.rIn) / 2 ? 'inner' : 'outer';
    setRingActive(key);
    const g = RINGS[key];
    dial.setPointerCapture(e.pointerId);
    g.drag = true; g.vel = 0; g.snap = null; moved = 0;
    lastA = downA = p.a; lastT = performance.now();
    spin(key);
  });
  dial.addEventListener('pointermove', e => {
    const g = RINGS[key];
    if (!g.drag) return;
    const a = polar(e).a, d = wrapA(a - lastA), now = performance.now();
    g.rot += d; moved += Math.abs(d);
    g.vel = Math.max(-0.3, Math.min(0.3, d / Math.max(1, (now - lastT) / 16.7)));
    lastA = a; lastT = now;
  });
  const up = () => {
    const g = RINGS[key];
    if (!g.drag) return;
    g.drag = false;
    if (moved < 0.05) {
      g.vel = 0;
      const N = g.wedges.length, step = TAU / N;
      spinTo(key, ((Math.round((downA - g.rot) / step) % N) + N) % N);
      return;
    }
    if (performance.now() - lastT > 80) g.vel = 0;               // finger stopped before lifting
    spin(key);
  };
  dial.addEventListener('pointerup', up);
  dial.addEventListener('pointercancel', up);
  // trackpad / mouse wheel on a Mac spins the ring under the pointer
  dial.addEventListener('wheel', e => {
    e.preventDefault();
    const k = polar(e).u < (RINGS.inner.rOut + RINGS.outer.rIn) / 2 ? 'inner' : 'outer';
    setRingActive(k);
    const g = RINGS[k];
    g.rot -= (e.deltaY + e.deltaX) * 0.003; g.vel = 0; g.snap = null;
    clearTimeout(dial._w); drawRing(k);
    dial._w = setTimeout(() => spin(k), 120);
  }, { passive: false });
  addEventListener('resize', () => { if (kb.classList.contains('open')) { drawRing('inner'); drawRing('outer'); } });
}
/* ---- pull-out keyboard (top-left corner piece) ----
   A plain grid keyboard in the same style: an idle-scrolling kaomoji strip on top
   (touch to stop it, drag to scroll, tap one to place), a number row, then a-m / n-z. */
let xShift = null;
let emoX = 0, emoHold = false, emoResume = 0, emoRAF = 0, emoTrack = null, emoHalf = 0;
function buildXkb() {
  xkb = document.createElement('div'); xkb.className = 'xkb';
  xkb.addEventListener('pointerdown', e => e.stopPropagation());

  const strip = document.createElement('div'); strip.className = 'emo-strip';
  emoTrack = document.createElement('div'); emoTrack.className = 'emo-track';
  const all = MODES[2].chunks.flatMap(c => c.items);
  [...all, ...all].forEach(e => { const el = mk('emo', e); el.dataset.e = e; emoTrack.append(el); });
  strip.append(emoTrack);
  let sx = 0, startX = 0, moved = 0, downEl = null;
  strip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    strip.setPointerCapture(e.pointerId);
    emoHold = true; sx = e.clientX; startX = emoX; moved = 0;
    downEl = e.target.closest('.emo'); if (downEl) downEl.classList.add('down');
  });
  strip.addEventListener('pointermove', e => {
    if (!emoHold) return;
    const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));
    if (moved > 8 && downEl) { downEl.classList.remove('down'); downEl = null; }
    emoX = startX + dx;
  });
  const up = () => {
    if (!emoHold) return;
    emoHold = false;
    if (downEl) { downEl.classList.remove('down'); if (moved <= 8) placeChar(downEl.dataset.e, downEl); downEl = null; }
    emoResume = performance.now() + 1800;                     // drift again after a pause
  };
  strip.addEventListener('pointerup', up);
  strip.addEventListener('pointercancel', up);

  const rows = [[...'1234567890'], [...'qwertyuiop'], [...'asdfghjkl'], [...'zxcvbnm']];
  // top row: [fold handle] kaomoji strip, + videos, cancel
  const top = document.createElement('div'); top.className = 'xrow top';
  const addK = document.createElement('div'); addK.className = 'xk icon add';
  addK.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3"/><path d="M9.5 9.5v5M7 12h5"/></svg>';
  addK.addEventListener('pointerdown', e => { e.stopPropagation(); addK.classList.add('down'); });
  addK.addEventListener('pointerup', () => addK.classList.remove('down'));
  addK.addEventListener('pointerleave', () => addK.classList.remove('down'));
  addK.addEventListener('click', e => { e.stopPropagation(); picker.click(); });   // file picker needs a real click
  const cancelK = document.createElement('div'); cancelK.className = 'xk icon cancel';
  cancelK.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  pressable(cancelK, () => finishEdit(false));
  let i = 0;
  xKeys = [];
  const iconKey = (svg, fn, repeat) => { const k = document.createElement('div'); k.className = 'xk icon'; k.innerHTML = `<svg viewBox="0 0 24 24">${svg}</svg>`; k.style.setProperty('--i', i++); pressable(k, fn, repeat); return k; };
  rows.forEach((r, ri) => {
    const row = document.createElement('div'); row.className = 'xrow' + (ri === 0 ? ' nums' : '');
    if (ri === 3) { xShift = iconKey('<path d="M12 4.5l7 7h-3.8v4.2H8.8v-4.2H5z"/><path d="M8.8 19.5h6.4"/>', tapCaps); row.append(xShift); }
    r.forEach(ch => {
      const k = mk('xk', ch); k.dataset.c = ch; k.style.setProperty('--i', i++);
      pressable(k, () => placeChar(capsState !== 'off' && isLetter(ch) ? ch.toUpperCase() : ch, k));
      xKeys.push(k); row.append(k);
    });
    if (ri === 2) {
      const ok = mk('xk ok', 'OK'); ok.style.setProperty('--i', i++);
      pressable(ok, () => finishEdit(true));
      row.append(ok);
    }
    if (ri === 3) {
      row.append(iconKey('<path d="M18.5 9.5H9.5a4.5 4.5 0 0 0 0 9h3"/><path d="M15 6l3.5 3.5L15 13"/>', () => typeKey('↻')));
      row.append(iconKey('<path d="M9.5 6H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 18H9.5L4 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>', () => typeKey('⌫'), true));
    }
    xkb.append(row);
  });
  top.append(strip, addK, cancelK);
  xkb.prepend(top);

  // handle in the top-left corner: tap, or push it back down-right, to fold the keyboard into the wheel
  const tab = document.createElement('div'); tab.className = 'xtab';
  tab.innerHTML = '<svg viewBox="0 0 58 58"><path d="M14 40 A 26 26 0 0 1 40 14"/></svg>';
  let tp = null;
  tab.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); tab.setPointerCapture(e.pointerId);
    tp = { x: e.clientX, y: e.clientY, moved: 0 }; tab.classList.add('down'); beginPull();
  });
  tab.addEventListener('pointermove', e => {
    if (!tp) return;
    const dx = e.clientX - tp.x, dy = e.clientY - tp.y;
    tp.moved = Math.max(tp.moved, Math.hypot(dx, dy));
    if (tp.moved > 8) setXProg(Math.max(0, Math.min(1, 1 - (dx + dy) / Math.SQRT2 / 320)));
  });
  const tabUp = () => {
    if (!tp) return;
    tab.classList.remove('down'); endPull();
    if (tp.moved <= 8) toggleXkb(false); else toggleXkb(xProg > .7);
    tp = null;
  };
  tab.addEventListener('pointerup', tabUp);
  tab.addEventListener('pointercancel', tabUp);
  xkb.append(tab);
  document.body.append(xkb);
}
function emoLoop(now) {
  emoRAF = requestAnimationFrame(emoLoop);
  if (!emoHalf) emoHalf = emoTrack.scrollWidth / 2;
  if (!emoHold && now > emoResume) emoX -= 0.45;
  if (emoHalf) { while (emoX <= -emoHalf) emoX += emoHalf; while (emoX > 0) emoX -= emoHalf; }
  emoTrack.style.transform = `translateX(${emoX}px)`;
}
let xProg = 0;                                              // 0 = folded into the wheel's corner, 1 = fully open
function placeOrigin() {
  // unfold from the wheel's top-left corner (measured in the keyboard's own box)
  xkb.style.transformOrigin = `${kb.offsetLeft - xkb.offsetLeft}px ${kb.offsetTop - xkb.offsetTop}px`;
}
function beginPull() { placeOrigin(); xkb.classList.add('dragging'); kb.style.transition = 'none'; }
function endPull() { xkb.classList.remove('dragging'); kb.style.transition = ''; }
function setXProg(p) {
  xProg = p;
  const q = 1 - p;
  xkb.style.transform = `perspective(1600px) rotateX(${(q * 28).toFixed(2)}deg) rotateY(${(-q * 28).toFixed(2)}deg) scale(${(0.12 + 0.88 * p).toFixed(3)})`;
  xkb.style.opacity = Math.min(1, p * 1.5).toFixed(3);
  // the wheel gives way to the keyboard
  kb.style.opacity = kb.classList.contains('open') ? Math.max(0, 1 - p * 1.4).toFixed(3) : '';
  kb.style.transform = p > 0 ? `scale(${(1 - 0.12 * p).toFixed(3)})` : '';
  kb.style.pointerEvents = p > 0.5 ? 'none' : '';
  bar.style.opacity = bar.classList.contains('open') ? Math.max(0, 1 - p * 1.6).toFixed(3) : '';
  bar.style.pointerEvents = p > 0.5 ? 'none' : '';
  if (p > 0 && !emoRAF) { emoHalf = 0; emoResume = 0; emoRAF = requestAnimationFrame(emoLoop); }
}
function toggleXkb(force) {
  const open = force === undefined ? !xkb.classList.contains('open') : force;
  placeOrigin();
  xkb.classList.toggle('open', open);
  extBtn.classList.toggle('on', open);
  setXProg(open ? 1 : 0);
  if (!open) { cancelAnimationFrame(emoRAF); emoRAF = 0; }
}

/* ---- the iPad's own keyboard, via a hidden text field kept in sync with the title ---- */
function buildNative() {
  nativeIn = document.createElement('input');
  nativeIn.id = 'native';
  nativeIn.setAttribute('autocapitalize', 'off'); nativeIn.setAttribute('autocorrect', 'off');
  nativeIn.setAttribute('autocomplete', 'off'); nativeIn.spellcheck = false;
  nativeIn.addEventListener('input', () => {
    if (!editing) return;
    editing.cutting = false;
    editing.buf = nativeIn.value;
    editing.parts = [...nativeIn.value];
    editing.txt.textContent = editing.buf;
  });
  nativeIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finishEdit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
  });
  document.body.append(nativeIn);
}

function updateShift() {}
function openKb() {
  kb.classList.add('open'); kb.setAttribute('aria-hidden', 'false');
  bar.classList.add('open');
  buildRing('inner'); buildRing('outer');
  applyCase();                       // replays the label fade-in
  active = 'outer';
  RINGS.outer.rot = SEL + 1.2; RINGS.outer.snap = SEL; spin('outer');
  RINGS.inner.rot = SEL - 1.0; RINGS.inner.snap = SEL; spin('inner');   // rings swirl in opposite ways
}
function closeKb() {
  kb.classList.remove('open'); kb.setAttribute('aria-hidden', 'true');
  bar.classList.remove('open');
  toggleXkb(false);
  kb.style.opacity = kb.style.transform = kb.style.pointerEvents = '';
  bar.style.opacity = bar.style.pointerEvents = '';
  if (document.activeElement === nativeIn) nativeIn.blur();
  for (const k in RINGS) cancelAnimationFrame(RINGS[k].raf);
}
kb.addEventListener('pointerdown', e => e.stopPropagation());
kb.addEventListener('touchmove', e => e.preventDefault(), { passive: false });   // never scroll the page from the keyboard
buildKb();

// Hardware keyboard while renaming
document.addEventListener('keydown', e => {
  if (!editing) return;
  if (e.target === nativeIn) return;                      // the iPad keyboard types into its own field
  if (e.metaKey || e.ctrlKey) return;
  e.preventDefault(); e.stopPropagation();
  if (e.key === 'Enter') finishEdit(true);
  else if (e.key === 'Escape') finishEdit(false);
  else if (e.key === 'Backspace') typeKey('⌫');
  else if (e.key === ' ') typeKey('space');
  else if (e.key.length === 1) typeKey(e.key);
}, true);

/* ================= spacebar = reset everything ================= */
document.addEventListener('keydown', e => {
  if (editing) return;
  if (e.code !== 'Space' && e.key !== ' ') return;
  e.preventDefault();
  resetAll();
});
function resetAll() {
  if (editing) return;
  unlock();
  [...wins].forEach(o => { o.closed = true; o.v.pause(); o.v.removeAttribute('src'); o.v.load(); o.el.remove(); });
  wins.length = 0;
  audible = null;
  activeWin = null;
  for (const it of items) if (it.row) { it.anim = (it.anim || 0) + 1; it.row.classList.remove('active', 'collapsed'); it.txt.textContent = it.title; }
  z = 10;
}

/* ================= self-update ================= */
// Bump BUILD whenever the page changes. On launch / when the app comes back to the
// foreground it checks the live copy (skipping every cache) and reloads if it's newer.
const BUILD = '2026-11-13-055809';
async function checkForUpdate() {
  try {
    if (!/^https?:/.test(location.protocol)) return;
    const url = location.href.split('#')[0].split('?')[0];
    const res = await fetch(url + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/^const BUILD = '([^']+)';/m);
    if (!m || m[1] === BUILD) return;
    const go = () => location.replace(url + '?v=' + encodeURIComponent(m[1]));
    if (!wins.length && !editing) go();
    else {
      // wait until nothing is open so nothing gets cut off mid-play
      const wait = setInterval(() => { if (!wins.length && !editing) { clearInterval(wait); go(); } }, 2000);
    }
  } catch (err) {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
addEventListener('pageshow', e => { if (e.persisted) checkForUpdate(); });

/* ================= boot ================= */
(async () => {
  const stored = await loadStored();
  if (stored.length) {
    for (const s of stored) {
      if (isDuplicate(s.name, s.size, s.mod)) continue;
      items.push({ name: s.name, title: titleFor(s.name), src: URL.createObjectURL(s.blob), size: s.size, mod: s.mod });
    }
  } else {
    const found = await Promise.all(MANIFEST.map(async n => {
      const src = encodeURI(n);
      return (await probe(src)) ? { name: n, title: titleFor(n), src } : null;
    }));
    items = found.filter(Boolean);
  }
  render();
})();
render();
</script>
