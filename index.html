<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHANTAS MAGORIAS">
<title>PHANTAS MAGORIAS</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    overflow-x: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  #list {
    padding: calc(14vh + env(safe-area-inset-top)) 0 45vh calc(4vw + env(safe-area-inset-left));
    min-height: 100vh; box-sizing: border-box;
  }
  .t {
    font-size: clamp(10px, 1.75vw, 24px);
    line-height: 1.5;
    white-space: nowrap;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: opacity .15s;
  }
  .t:active { opacity: .3; }
  .t .txt { transition: color .2s; }
  .t.active .txt { color: #ff6fb5; }
  .t .ln {
    display: inline-block; vertical-align: middle;
    width: 0; height: 1.5px; border-radius: 1px;
    background: var(--c, #fff);
    box-shadow: 0 0 6px var(--c, transparent);
    transition: width .2s ease, background .3s ease;
  }
  .t.collapsed .ln { width: 1.6em; }

  .win {
    position: fixed;
    background: #000;
    touch-action: none;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.35);
  }
  .win.locked {
    box-shadow: 0 0 0 1px rgba(255,150,205,.8), 0 0 0 3.5px rgba(255,111,181,.14),
                0 0 22px rgba(255,111,181,.32), inset 0 0 0 .5px rgba(255,255,255,.35);
  }
  .win.lockpulse { animation: lockpulse .5s ease; }
  @keyframes lockpulse { 40% { box-shadow: 0 0 0 1.5px rgba(255,170,215,.95), 0 0 0 5px rgba(255,111,181,.22), 0 0 40px rgba(255,111,181,.55); } }
  #list { position: relative; }
  .aud { position: absolute; cursor: pointer; animation: audin .32s cubic-bezier(.2,.9,.3,1.3) backwards; }
  .aud canvas { width: 100%; height: 100%; display: block; }
  .aud.out { opacity: 0; transform: scale(.5); transition: opacity .18s, transform .18s; }
  @keyframes audin { from { opacity: 0; transform: scale(.3); } }
  .win { left: 0; top: 0; will-change: transform; }
  .win.anim { transition: transform .28s ease, width .28s ease, height .28s ease; }
  .win.flash { box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); }
  .win video {
    width: 100%; height: 100%; display: block;
    object-fit: contain; background: #000;
    pointer-events: none;
  }
  .x, .rs { position: absolute; width: 40px; height: 40px; touch-action: none; }
  .x { top: 0; left: 0; }
  .x::before, .x::after {
    content: ""; position: absolute; left: 13px; top: 19.5px;
    width: 14px; height: 1px; background: rgba(255,255,255,.8);
  }
  .x::before { transform: rotate(45deg); }
  .x::after  { transform: rotate(-45deg); }
  .rs { right: 0; bottom: 0; }
  .rs::after {
    content: ""; position: absolute; right: 7px; bottom: 7px;
    width: 12px; height: 12px;
    border-right: 1px solid rgba(255,255,255,.8);
    border-bottom: 1px solid rgba(255,255,255,.8);
  }
  #pick { display: none; }

  /* ---- rename mode ---- */
  .t.editing { background: linear-gradient(90deg, rgba(255,111,181,.12), rgba(255,111,181,0) 60%); }
  .t.editing .etxt { color: #ff6fb5; }
  .t .eext { color: rgba(255,111,181,.45); }
  .caret {
    display: inline-block; width: 1px; height: 1.05em;
    vertical-align: -0.18em; margin: 0 1px; background: #ff6fb5;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .t.saved .txt { color: #2ee6d2; }
  .t.canceled .txt { color: #ff3b4a; }

  /* ---- keyboard: a quiet type sheet ---- */
  #kb {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100000;
    padding: 14px calc(18px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    background: rgba(0,0,0,.82);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-top: .5px solid rgba(255,255,255,.28);
    touch-action: none; overscroll-behavior: contain;
    transform: translateY(105%); opacity: 0; pointer-events: none;
    transition: transform .42s cubic-bezier(.2,.85,.25,1), opacity .25s ease;
    font-weight: 100;
  }
  #kb.open { transform: none; opacity: 1; pointer-events: auto; }
  .kb-top {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 2px 6px 12px; margin-bottom: 8px;
    border-bottom: .5px solid rgba(255,255,255,.12);
    font-size: 14px; letter-spacing: .14em; text-transform: lowercase;
  }
  .kb-act { padding: 6px 4px; cursor: pointer; transition: opacity .12s; }
  .kb-act.down { opacity: .45; }
  .kb-cancel { color: #ff3b4a; }
  .kb-add { color: rgba(255,255,255,.7); }
  .kb-enter { color: #2ee6d2; text-shadow: 0 0 14px rgba(46,230,210,.55); }
  .kb-body { display: flex; gap: 22px; align-items: stretch; }
  .kb-keys { flex: 1; display: grid; grid-template-rows: repeat(5, 1fr); row-gap: 2px; }
  .kb-row { display: flex; justify-content: space-between; }
  .k {
    flex: 1 1 0; height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; cursor: pointer; position: relative;
    transition: color .1s, transform .1s;
  }
  .k::after {
    content: ""; position: absolute; left: 50%; bottom: 7px; width: 0; height: 1px;
    background: #ff6fb5; transform: translateX(-50%); transition: width .12s;
  }
  .k.down { color: #ff6fb5; transform: translateY(-2px); }
  .k.down::after { width: 14px; }
  .k.word { font-size: 12px; letter-spacing: .14em; color: rgba(255,255,255,.55); flex-grow: 1.6; }
  .k.space { flex-grow: 5; }
  .k.on { color: #ff6fb5; }
  .kb-emo { width: 330px; display: flex; flex-direction: column; border-left: .5px solid rgba(255,255,255,.12); padding-left: 18px; }
  .emo-tabs { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; letter-spacing: .14em; margin-bottom: 6px; }
  .emo-tab { color: rgba(255,255,255,.45); padding: 6px 0; cursor: pointer; transition: color .15s; }
  .emo-tab.on { color: #ff6fb5; }
  .emo-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 44px; column-gap: 10px; }
  .emo-grid .k { justify-content: flex-start; font-size: 15px; white-space: nowrap; overflow: hidden; }
  .emo-grid .k::after { left: 0; transform: none; }
  #kb.open .k, #kb.open .kb-act, #kb.open .emo-tab {
    animation: kin .34s ease backwards; animation-delay: calc(var(--i, 0) * 6ms + 60ms);
  }
  @keyframes kin { from { opacity: 0; transform: translateY(6px); } }
  .emo-grid.swap .k { animation: kin .26s ease backwards; animation-delay: calc(var(--j, 0) * 22ms); }
  @media (max-width: 760px) { .kb-emo { width: 220px; } .emo-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="list"></div>
<input id="pick" type="file" accept="video/*" multiple>
<div id="kb" aria-hidden="true"></div>

<script>
/* Videos sitting next to this file (used when opened from the folder on a Mac). */
const MANIFEST = [
  "00125.mov",
  "00132.mov",
  "RPReplay_Final1698920393.mp4",
  "Screen Recording 2024-10-24 at 11.44.12 PM.mov",
  "v12044gd0000clmh43fog65tcoasrtfg.mov",
  "v14044g50000ck4d5erc77ubgiflmbcg.mov",
  "v15044gf0000d3vqcm7og65kbiqd0stg.MP4"
];

/* iOS / iPadOS only lets one video play with sound at a time.
   There, every window keeps playing muted and the sound follows the window you tap. */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const list = document.getElementById('list');
const picker = document.getElementById('pick');
let items = [];          // { title, src, size, mod }
const wins = [];         // open windows
let z = 10;
const PAD = 14;

/* ================= list ================= */
function render() {
  list.innerHTML = '';
  if (!items.length) {
    const d = document.createElement('div');
    d.className = 't';
    d.textContent = 'tap to load videos';
    d.onclick = () => picker.click();
    list.append(d);
    return;
  }
  for (const it of items) {
    const d = document.createElement('div');
    d.className = 't';
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = it.title;
    const ln = document.createElement('span'); ln.className = 'ln';
    d.append(txt, ln);
    it.row = d; it.txt = txt;

    // tap = open, tap-and-hold = rename
    let hold = null, hx = 0, hy = 0;
    d.addEventListener('pointerdown', e => {
      it.skipClick = false;
      if (editing) return;
      hx = e.clientX; hy = e.clientY;
      hold = setTimeout(() => { hold = null; it.skipClick = true; startEdit(it); }, 480);
    });
    d.addEventListener('pointermove', e => {
      if (hold && Math.hypot(e.clientX - hx, e.clientY - hy) > 10) { clearTimeout(hold); hold = null; }
    });
    ['pointerup', 'pointercancel'].forEach(t => d.addEventListener(t, () => { if (hold) { clearTimeout(hold); hold = null; } }));
    d.addEventListener('contextmenu', e => e.preventDefault());
    d.onclick = e => {
      if (it.skipClick) { it.skipClick = false; return; }
      if (editing) return;
      openWin(it, e.clientX, e.clientY);
    };
    list.append(d);
  }
  syncRows();
  paintLines();
  // videos added from the keyboard mid-rename: keep the rename going on the rebuilt row
  if (editing && editing.it.row) {
    const it = editing.it;
    const txt = mk('etxt', editing.buf);
    it.row.className = 't editing';
    it.row.innerHTML = '';
    it.row.append(txt, mk('caret'), mk('eext', editing.ext));
    editing.txt = txt; editing.cutting = false;
  }
}

/* Long-press on empty space = add more videos */
let lp = null, lpX = 0, lpY = 0;
list.addEventListener('pointerdown', e => {
  if (e.target.closest('.t') || editing) return;
  lpX = e.clientX; lpY = e.clientY;
  lp = setTimeout(() => { lp = null; picker.click(); }, 650);
});
const cancelLp = e => {
  if (!lp) return;
  if (e.type === 'pointermove' && Math.hypot(e.clientX - lpX, e.clientY - lpY) < 10) return;
  clearTimeout(lp); lp = null;
};
['pointerup', 'pointercancel', 'pointermove'].forEach(t => list.addEventListener(t, cancelLp));

/* ================= duplicates ================= */
function isDuplicate(name, size, mod) {
  return items.some(i =>
    i.name === name ||
    (size && i.size === size && mod && i.mod === mod));
}

/* ================= storage (keeps picked videos between visits) ================= */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('phantas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('videos', { keyPath: 'name' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (err) { rej(err); }
  });
}
async function saveFiles(files) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) {}
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction('videos', 'readwrite');
      for (const f of files) tx.objectStore('videos').put({ name: f.name, blob: f, size: f.size, mod: f.lastModified, added: Date.now() });
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (err) { console.warn('could not store videos', err); }
}
async function loadStored() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('videos').objectStore('videos').getAll();
      r.onsuccess = () => res(r.result.sort((a, b) => a.added - b.added));
      r.onerror = () => rej(r.error);
    });
  } catch (err) { return []; }
}

picker.addEventListener('change', async () => {
  const files = [...picker.files];
  picker.value = '';
  const fresh = [];
  for (const f of files) {
    if (isDuplicate(f.name, f.size, f.lastModified)) continue;
    items.push({ name: f.name, title: titleFor(f.name), src: URL.createObjectURL(f), size: f.size, mod: f.lastModified });
    fresh.push(f);
  }
  if (!fresh.length) return;
  render();
  saveFiles(fresh);
});

/* Check whether a video next to this page is reachable */
function probe(src) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    const done = ok => { clearTimeout(t); v.removeAttribute('src'); v.load(); res(ok); };
    const t = setTimeout(() => done(false), 4000);
    v.onloadedmetadata = () => done(true);
    v.onerror = () => done(false);
    v.src = src;
  });
}

/* ================= layout ================= */
const view = () => ({ W: innerWidth, H: innerHeight });
/* Largest a window opens at: about 1/5 of the screen's area. */
const capWidth = aspect => {
  const { W, H } = view();
  let w = Math.sqrt(W * H * 0.2 * aspect);
  return Math.min(w, W - 2 * PAD, (H - 2 * PAD) * aspect);
};

function apply(o, animate) {
  o.el.classList.toggle('anim', !!animate);
  o.el.style.width = o.w + 'px';
  o.el.style.height = o.h + 'px';
  o.el.style.transform = `translate3d(${o.left}px, ${o.top}px, 0)`;
}

const anyAdjusted = () => wins.some(o => o.adjusted);

/* Where the visible title text sits on screen right now (windows try not to cover it). */
function textRects() {
  const out = [];
  for (const row of list.children) {
    const t = row.querySelector('.txt, .etxt');
    if (!t || !t.textContent) continue;
    const r = t.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || r.width === 0) continue;
    out.push({ left: r.left - 8, top: r.top - 4, w: r.width + 16, h: r.height + 8 });
  }
  return out;
}
function textRight() {
  return textRects().reduce((m, r) => Math.max(m, r.left + r.w), 0);
}

/* Untouched windows: keep the opening size, and pick the spot that overlaps other windows
   and the title text the least (leaning toward the top-right). A little stacking is fine
   once the screen fills up; new ones never move old ones. */
function placeSpread(o, animate) {
  const { W, H } = view();
  // a little variety: each window opens somewhere between ~70% and 100% of the size cap
  if (o.scale == null) o.scale = 0.7 + Math.random() * 0.3;
  const w = capWidth(o.aspect) * o.scale, h = w / o.aspect;
  const others = wins.filter(p => p !== o);
  const texts = textRects();
  const hit = (l, t, p) => {
    const ox = Math.max(0, Math.min(l + w, p.left + p.w) - Math.max(l, p.left));
    const oy = Math.max(0, Math.min(t + h, p.top + p.h) - Math.max(t, p.top));
    return ox * oy;
  };
  const area = w * h, diag = Math.hypot(W, H);
  const spots = [];
  const step = 16, jx = Math.random() * step, jy = Math.random() * step;
  for (let t = PAD + jy; t <= Math.max(PAD, H - h - PAD); t += step) {
    for (let l = PAD + jx; l <= Math.max(PAD, W - w - PAD); l += step) {
      let win = 0, txt = 0;
      for (const p of others) win += hit(l, t, p);
      for (const p of texts) txt += hit(l, t, p);
      const lean = Math.hypot(W - PAD - (l + w), t - PAD) / diag;     // prefer top-right
      spots.push({ score: (win / area) * 1.0 + (txt / area) * 4 + lean * 0.12, l, t });
    }
  }
  // don't always take the single best spot: pick at random among the near-best ones
  spots.sort((a, b) => a.score - b.score);
  const near = spots.filter(p => p.score <= (spots[0] ? spots[0].score : 0) + 0.08).slice(0, 40);
  const best = near.length ? near[Math.floor(Math.random() * near.length)] : spots[0];
  Object.assign(o, { w, h, left: best ? best.l : W - PAD - w, top: best ? best.t : PAD });
  apply(o, animate);
}

function placeFree(o, ax, ay, animate) {
  const { W, H } = view();
  const others = wins.filter(p => p !== o);
  const texts = textRects();
  const hit = (l, t, w, h, p) => {
    const ox = Math.max(0, Math.min(l + w, p.left + p.w) - Math.max(l, p.left));
    const oy = Math.max(0, Math.min(t + h, p.top + p.h) - Math.max(t, p.top));
    return ox * oy;
  };
  const overlap = (l, t, w, h) =>
    others.reduce((s, p) => s + hit(l, t, w, h, p), 0) +
    texts.reduce((s, p) => s + hit(l, t, w, h, p) * 0.6, 0);

  let fallback = null;
  for (const s of [1, 0.8, 0.64, 0.5, 0.38]) {
    const w = Math.max(120, capWidth(o.aspect) * s), h = w / o.aspect;
    if (w > W - 2 * PAD || h > H - 2 * PAD) continue;
    let bestHere = null;
    const step = 20;
    for (let t = PAD; t <= H - h - PAD; t += step) {
      for (let l = PAD; l <= W - w - PAD; l += step) {
        const ov = overlap(l, t, w, h);
        const dist = Math.hypot(l + w / 2 - ax, t + h / 2 - ay);
        if (ov === 0 && (!bestHere || dist < bestHere.dist)) bestHere = { l, t, w, h, dist };
        const score = ov / (w * h) * 1e6 + dist;
        if (!fallback || score < fallback.score) fallback = { l, t, w, h, score };
      }
    }
    if (bestHere) { Object.assign(o, { left: bestHere.l, top: bestHere.t, w: bestHere.w, h: bestHere.h }); apply(o, animate); return; }
  }
  if (fallback) Object.assign(o, { left: fallback.l, top: fallback.t, w: fallback.w, h: fallback.h });
  apply(o, animate);
}

// After a video's real shape is known, re-pick its spot (only if you haven't touched it).
function relayout(o) {
  if (!o || o.adjusted) return;
  if (anyAdjusted()) placeFree(o, o.left + o.w / 2, o.top + o.h / 2, true);
  else placeSpread(o, true);
}

/* ================= audio focus (iOS) ================= */
let audible = null;
function giveSound(o) {
  if (lockWin && lockWin !== o) { setMuted(o, true); return; }   // sound is locked elsewhere
  audible = o;
  if (!IOS) { setMuted(o, false); return; }
  for (const p of wins) if (p !== o) setMuted(p, true);
  setMuted(o, false);
}

/* ================= title animation ================= */
// Reverse-types a title down into a short line, or types it back out.
function typeTo(it, full) {
  if (!it.txt) return;
  const target = full ? it.title : '';
  const token = (it.anim = (it.anim || 0) + 1);
  if (full) it.row.classList.remove('collapsed');
  const total = it.title.length || 1;
  const stepMs = Math.max(6, Math.min(28, 380 / total));
  const tick = () => {
    if (it.anim !== token) return;
    const cur = it.txt.textContent;
    if (cur === target) {
      if (!full) it.row.classList.add('collapsed');
      return;
    }
    it.txt.textContent = full ? it.title.slice(0, cur.length + 1) : cur.slice(0, -1);
    setTimeout(tick, stepMs);
  };
  tick();
}
function setRow(it, state) {          // 'idle' | 'active' | 'collapsed'
  if (!it.row) return;
  it.row.classList.toggle('active', state === 'active');
  typeTo(it, state !== 'collapsed');
}

let activeWin = null;
function setActive(o) {
  if (activeWin === o) return;
  if (activeWin && !activeWin.closed) setRow(activeWin.it, 'collapsed');
  activeWin = o;
  if (o) setRow(o.it, 'active');
}

/* ================= windows ================= */
function front(o) { o.el.style.zIndex = ++z; o.z = z; setActive(o); }

function closeWin(o) {
  if (lockWin === o) unlock();
  o.closed = true;
  o.v.pause(); o.v.removeAttribute('src'); o.v.load();
  o.el.remove();
  wins.splice(wins.indexOf(o), 1);
  setRow(o.it, 'idle');
  const top = wins.reduce((a, b) => (!a || b.z > a.z ? b : a), null);
  if (activeWin === o) { activeWin = null; if (top) setActive(top); }
  if (audible === o) {
    audible = null;
    if (top && IOS) giveSound(top);
  }
  // closing never moves the other windows
}

function openWin(it, x, y) {
  // Already open? Bring it forward instead of opening a duplicate.
  const existing = wins.find(o => o.it === it);
  if (existing) {
    front(existing);
    existing.el.classList.add('flash');
    setTimeout(() => existing.el.classList.remove('flash'), 350);
    if (IOS) giveSound(existing);
    if (existing.v.paused) existing.v.play().catch(() => {});
    return;
  }

  const el = document.createElement('div');
  el.className = 'win';
  const v = document.createElement('video');
  v.src = it.src;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.loop = true;
  v.preload = 'auto';
  const xb = document.createElement('div'); xb.className = 'x';
  const rs = document.createElement('div'); rs.className = 'rs';
  el.append(v, xb, rs);
  document.body.append(el);

  const w0 = capWidth(16 / 9);
  const o = { it, el, v, aspect: 16 / 9, w: w0, h: w0 * 9 / 16,
              left: x, top: y, adjusted: false, closed: false };
  o.left = x - o.w / 2; o.top = y - o.h / 2;
  wins.push(o);
  front(o);

  if (anyAdjusted()) placeFree(o, x, y, false);
  else placeSpread(o, false);

  v.addEventListener('loadedmetadata', () => {
    if (!v.videoWidth) return;
    o.aspect = v.videoWidth / v.videoHeight;
    if (o.adjusted) { o.h = o.w / o.aspect; apply(o, false); }
    else relayout(o);
  });

/* ================= audio lock ================= */
let lockWin = null, actx = null, analyser = null, audEl = null, audCv = null, audRaf = 0;
const srcNodes = new WeakMap();
const td = new Uint8Array(512);
let phase = 0;

// Mute/unmute instantly: the element itself, and its gain if it's routed for the sound-wave.
function setMuted(o, m) {
  o.v.muted = m;
  const n = srcNodes.get(o.v);
  if (n && actx) {
    try {
      n.gain.gain.cancelScheduledValues(actx.currentTime);
      n.gain.gain.setValueAtTime(m ? 0 : 1, actx.currentTime);
    } catch (err) { n.gain.gain.value = m ? 0 : 1; }
  }
}
function ensureAudioCtx() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
  } catch (err) {}
}
// Live waveform needs the page served over http(s) with a running audio context;
// otherwise the indicator still animates, just not from the real sound.
function attachAnalyser(o) {
  analyser = null;
  if (!/^https?:$/.test(location.protocol) || !actx || actx.state !== 'running') return;
  try {
    let node = srcNodes.get(o.v);
    if (!node) {
      const src = actx.createMediaElementSource(o.v), gain = actx.createGain();
      gain.gain.value = o.v.muted ? 0 : 1;
      src.connect(gain); gain.connect(actx.destination);
      node = { src, gain }; srcNodes.set(o.v, node);
    }
    const src = node.src;
    analyser = actx.createAnalyser();
    analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
    const sink = actx.createGain(); sink.gain.value = 0;
    src.connect(analyser); analyser.connect(sink); sink.connect(actx.destination);
    analyser._src = src;
  } catch (err) { analyser = null; }
}
function detachAnalyser() {
  try { if (analyser && analyser._src) analyser._src.disconnect(analyser); } catch (err) {}
  analyser = null;
}

function setLock(o) {
  o.el.classList.remove('lockpulse'); void o.el.offsetWidth; o.el.classList.add('lockpulse');
  if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
  if (lockWin === o) return;
  if (lockWin) { lockWin.el.classList.remove('locked'); detachAnalyser(); }
  lockWin = o;
  audible = o;
  o.el.classList.add('locked');
  for (const p of wins) setMuted(p, p !== o);
  if (o.v.paused) o.v.play().catch(() => {});
  attachAnalyser(o);

}
function unlock() {
  if (!lockWin) return;
  lockWin.el.classList.remove('locked');
  lockWin = null;
  detachAnalyser();
  hideAud();
  if (!IOS) for (const p of wins) setMuted(p, false);   // on desktop everything is audible again
}

function showAud() {
  if (audEl) { audEl.remove(); cancelAnimationFrame(audRaf); }
  audEl = document.createElement('div'); audEl.className = 'aud';
  audCv = document.createElement('canvas'); audEl.append(audCv);
  audEl.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); });
  audEl.addEventListener('click', e => { e.stopPropagation(); unlock(); });
  list.append(audEl);

  loop();
}
function hideAud() {
  cancelAnimationFrame(audRaf);
  if (audEl) { const el = audEl; el.classList.add('out'); setTimeout(() => el.remove(), 200); }
  audEl = null;
}

// Sound-wave graphic, left of the locked video's title: same height as the text,
// same width as the collapse line, same colour as that title's line.
function drawAud() {
  if (!lockWin || !audEl) return;
  const row = lockWin.it.row;
  if (!row || !row.isConnected) { audEl.style.display = 'none'; return; }
  if (!audEl.isConnected) list.append(audEl);
  audEl.style.display = '';
  // measuring forces layout, so only re-measure every ~12 frames
  if (!drawAud.m || drawAud.row !== row || ++drawAud.tick % 12 === 0) {
    const fs = parseFloat(getComputedStyle(row).fontSize) || 16;
    const w = fs * 1.6, h = fs;
    audEl.style.width = w + 'px'; audEl.style.height = h + 'px';
    audEl.style.left = (row.offsetLeft - w - fs * 0.5) + 'px';
    audEl.style.top = (row.offsetTop + (row.offsetHeight - h) / 2) + 'px';
    let color = '#fff';
    if (row.classList.contains('collapsed')) {
      const ln = row.querySelector('.ln');
      color = (ln && ln.style.getPropertyValue('--c')) || '#fff';
    } else {
      const t = row.querySelector('.txt, .etxt');
      if (t) color = getComputedStyle(t).color;
    }
    drawAud.m = { w, h, color }; drawAud.row = row;
    if (!drawAud.tick) drawAud.tick = 0;
  }
  const { w, h, color } = drawAud.m;

  const dpr = devicePixelRatio || 1;
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (audCv.width !== cw || audCv.height !== ch) { audCv.width = cw; audCv.height = ch; }
  const g = audCv.getContext('2d');
  if (!g) return;
  g.clearRect(0, 0, cw, ch);
  g.strokeStyle = color; g.lineWidth = Math.max(1, dpr * 0.9);
  g.shadowColor = color; g.shadowBlur = 4 * dpr;
  g.lineJoin = 'round'; g.lineCap = 'round';
  if (analyser) analyser.getByteTimeDomainData(td);
  phase += 0.05;
  g.beginPath();
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const f = i / N;
    const idle = Math.sin(f * Math.PI * 4 + phase) * 0.12;                 // always a little alive
    const live = analyser ? Math.max(-1, Math.min(1, (td[Math.floor(f * (td.length - 1))] - 128) / 128 * 2.4)) : Math.sin(f * Math.PI * 6 - phase * 1.7) * 0.18;
    const env = Math.sin(f * Math.PI);                                      // taper the ends
    const y = ch / 2 + (live + idle) * env * (ch / 2 - g.lineWidth * 2);
    i ? g.lineTo(f * cw, y) : g.moveTo(f * cw, y);
  }
  g.stroke();
}

/* ================= empty-space taps: 2 fingers = reset, 3 fingers = fullscreen (or the F key) ================= */
function toggleFullscreen() {
  const d = document, el = d.documentElement;

  try {
    if (isFs) (d.exitFullscreen || d.webkitExitFullscreen).call(d);

  } catch (err) { console.warn('fullscreen not available', err); }
}
let multiTap = null;
list.addEventListener('touchstart', e => {
  if (editing) { multiTap = null; return; }
  const onTitle = [...e.touches].some(t => t.target.closest && t.target.closest('.t'));
  if (e.touches.length >= 2 && !onTitle) {
    if (!multiTap) multiTap = { t: performance.now(), x: e.touches[0].clientX, y: e.touches[0].clientY, n: 0 };
    multiTap.n = Math.max(multiTap.n, e.touches.length);

/* ================= rainbow collapse lines ================= */
// Collapsed lines are coloured in order, one hue each; 12 lines make the full spectrum, then it loops.
let paintQueued = false;
function paintLines() {
  paintQueued = false;
  let n = 0;
  for (const row of list.children) {
    const ln = row.querySelector('.ln');
    if (!ln) continue;
    if (row.classList.contains('collapsed')) {

}

const TITLE_KEY = 'phantas-titles';
let savedTitles = {};

function saveTitle(name, title) {
  savedTitles[name] = title;
  try { localStorage.setItem(TITLE_KEY, JSON.stringify(savedTitles)); } catch (err) {}
}
function splitExt(name) {
  const i = name.lastIndexOf('.');
  return i > 0 ? [name.slice(0, i), name.slice(i)] : [name, ''];
}
function titleFor(name) { return savedTitles[name] || name; }

const mk = (cls, text) => { const e = document.createElement('span'); e.className = cls; if (text != null) e.textContent = text; return e; };

function rowState(it) {
  const o = wins.find(w => w.it === it);
  if (!o) return 'idle';
  return activeWin === o ? 'active' : 'collapsed';
}
// Rebuild a row's normal contents and put it in the right state with no animation.
function restoreRow(it, blank) {
  if (!it.row) return;
  it.anim = (it.anim || 0) + 1;
  const st = rowState(it);
  it.row.className = 't';
  it.row.innerHTML = '';
  it.txt = mk('txt', (st === 'collapsed' || blank) ? '' : it.title);
  it.row.append(it.txt, mk('ln'));
  if (st === 'collapsed') it.row.classList.add('collapsed');
  if (st === 'active') it.row.classList.add('active');

}
function syncRows() { for (const it of items) if (it.row && (!editing || editing.it !== it)) restoreRow(it); }

let editing = null;   // { it, buf, ext, txt, shift, cutting }

function startEdit(it) {
  if (editing) return;
  it.anim = (it.anim || 0) + 1;
  const ext = splitExt(it.name)[1];
  const base = it.title.endsWith(ext) ? it.title.slice(0, it.title.length - ext.length) : it.title;
  const txt = mk('etxt', base);
  it.row.className = 't editing';
  it.row.innerHTML = '';
  it.row.append(txt, mk('caret'), mk('eext', ext));
  editing = { it, buf: '', ext, txt, shift: false, cutting: true };
  if (navigator.vibrate) try { navigator.vibrate(8); } catch (err) {}

  // cut the old title away, right to left
  let cur = [...base];
  const step = Math.max(8, Math.min(30, 320 / (cur.length || 1)));
  const tick = () => {
    if (!editing || editing.it !== it || !editing.cutting) return;
    if (!cur.length) { editing.cutting = false; return; }
    cur.pop(); txt.textContent = cur.join('');
    setTimeout(tick, step);
  };
  setTimeout(tick, 90);

  openKb();
}

function typeKey(k) {
  if (!editing) return;
  editing.cutting = false;
  if (k === '⌫') editing.buf = [...editing.buf].slice(0, -1).join('');
  else if (k === '⇧') { editing.shift = !editing.shift; updateShift(); return; }
  else if (k === 'space') editing.buf += ' ';
  else {
    let ch = k;
    if (editing.shift && ch.length === 1) { ch = ch.toUpperCase(); editing.shift = false; updateShift(); }
    editing.buf += ch;
  }
  editing.txt.textContent = editing.buf;
}

function finishEdit(save) {
  if (!editing) return;
  const { it, buf, ext } = editing;
  editing = null;
  closeKb();
  const base = buf.trim();
  const ok = save && base.length > 0;
  if (ok) { it.title = base + ext; saveTitle(it.name, it.title); }
  const st = restoreRow(it, true);
  it.row.classList.add(ok ? 'saved' : 'canceled');
  setTimeout(() => it.row && it.row.classList.remove('saved', 'canceled'), 650);
  if (st !== 'collapsed') typeTo(it, true);
}

/* Tap = press on release, only if the finger didn't travel (so scrolling/sliding never types).

function pressable(el, fn, repeat) {
  let sx = 0, sy = 0, live = false, delay = null, rep = null;
  const stop = () => { el.classList.remove('down'); clearTimeout(delay); clearInterval(rep); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    sx = e.clientX; sy = e.clientY; live = true;
    el.classList.add('down');
    if (repeat) { fn(); delay = setTimeout(() => { rep = setInterval(fn, 55); }, 380); }
  });
  el.addEventListener('pointermove', e => {
    if (live && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { live = false; stop(); }
  });
  el.addEventListener('pointerup', e => {

  });
}
function openKb() { updateShift(); kb.classList.add('open'); kb.setAttribute('aria-hidden', 'false'); }
function closeKb() { kb.classList.remove('open'); kb.setAttribute('aria-hidden', 'true'); }
kb.addEventListener('pointerdown', e => e.stopPropagation());
kb.addEventListener('touchmove', e => e.preventDefault(), { passive: false });   // never scroll the page from the keyboard
buildKb();

// Hardware keyboard while renaming
document.addEventListener('keydown', e => {
  if (!editing) return;
  if (e.metaKey || e.ctrlKey) return;
  e.preventDefault(); e.stopPropagation();
  if (e.key === 'Enter') finishEdit(true);
  else if (e.key === 'Escape') finishEdit(false);
  else if (e.key === 'Backspace') typeKey('⌫');
  else if (e.key === ' ') typeKey('space');
  else if (e.key.length === 1) { editing.cutting = false; editing.buf += e.key; editing.txt.textContent = editing.buf; }
}, true);

/* ================= spacebar = reset everything ================= */
document.addEventListener('keydown', e => {
  if (editing) return;
  if (e.code !== 'Space' && e.key !== ' ') return;
  e.preventDefault();
  resetAll();
});
function resetAll() {
  if (editing) return;
  unlock();
  [...wins].forEach(o => { o.closed = true; o.v.pause(); o.v.removeAttribute('src'); o.v.load(); o.el.remove(); });
  wins.length = 0;
  audible = null;
  activeWin = null;
  for (const it of items) if (it.row) { it.anim = (it.anim || 0) + 1; it.row.classList.remove('active', 'collapsed'); it.txt.textContent = it.title; }
  z = 10;
}

/* ================= self-update ================= */
// Bump BUILD whenever the page changes. On launch / when the app comes back to the
// foreground it checks the live copy (skipping every cache) and reloads if it's newer.
const BUILD = '2026-11-13-004202';
async function checkForUpdate() {
  try {
    if (!/^https?:/.test(location.protocol)) return;
    const url = location.href.split('#')[0].split('?')[0];
    const res = await fetch(url + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/^const BUILD = '([^']+)';/m);
    if (!m || m[1] === BUILD) return;
    const go = () => location.replace(url + '?v=' + encodeURIComponent(m[1]));
    if (!wins.length && !editing) go();
    else {
      // wait until nothing is open so nothing gets cut off mid-play
      const wait = setInterval(() => { if (!wins.length && !editing) { clearInterval(wait); go(); } }, 2000);
    }
  } catch (err) {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
addEventListener('pageshow', e => { if (e.persisted) checkForUpdate(); });

/* ================= boot ================= */
(async () => {
  const stored = await loadStored();
  if (stored.length) {
    for (const s of stored) {
      if (isDuplicate(s.name, s.size, s.mod)) continue;
      items.push({ name: s.name, title: titleFor(s.name), src: URL.createObjectURL(s.blob), size: s.size, mod: s.mod });
    }
  } else {
    const found = await Promise.all(MANIFEST.map(async n => {
      const src = encodeURI(n);
      return (await probe(src)) ? { name: n, title: titleFor(n), src } : null;
    }));
    items = found.filter(Boolean);
  }
  render();
})();
render();
</script>
